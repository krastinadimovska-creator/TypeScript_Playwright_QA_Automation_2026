<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sign in | TaskBoard</title>
	<link rel="stylesheet" href="../../02-playwright/pages/styles.css">
	<style>
		main { max-width: 480px; }
	</style>
</head>
<body>
	<header class="site-header"><span class="brand">TaskBoard.</span></header>
	<main>
		<h1>Sign in</h1>
		<p class="muted">Sign in to plan your day.</p>
		<form id="login-form" class="panel" novalidate>
			<label for="username">Username</label>
			<input id="username" name="username" autocomplete="username">
			<label for="password">Password</label>
			<input id="password" name="password" type="password" autocomplete="current-password">
			<div class="actions"><button type="submit">Sign in</button></div>
		</form>
		<p id="login-error" class="status error" role="alert" hidden></p>
		<aside class="panel" aria-labelledby="demo-heading">
			<h2 id="demo-heading">Demo account</h2>
			<p><strong>Username:</strong> <code>alex</code></p>
			<p><strong>Password:</strong> <code>secret123</code></p>
		</aside>
	</main>
	<footer>TaskBoard / Workshop demo app. Data lives only in this browser tab.</footer>
	<script>
		// This is a local teaching demo, not real authentication or a security boundary.
		const USER_KEY = 'taskboard-user';
		const form = document.querySelector('#login-form');
		const username = document.querySelector('#username');
		const password = document.querySelector('#password');
		const error = document.querySelector('#login-error');

		form.addEventListener('submit', (event) => {
			event.preventDefault();
			error.hidden = true;

			if (!username.value.trim() || !password.value) {
				error.textContent = 'Enter your username and password.';
				error.hidden = false;
				return;
			}

			if (username.value.trim() === 'alex' && password.value === 'secret123') {
				// The tasks page reads this demo session value to decide whether to render.
				sessionStorage.setItem(USER_KEY, 'Alex');
				window.location.href = 'tasks.html';
				return;
			}

			error.textContent = 'Wrong username or password.';
			error.hidden = false;
		});
	</script>
</body>
</html>
